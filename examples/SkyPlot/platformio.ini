; Sky plot of the satellites a receiver reports, drawn into a LovyanGFX sprite.
; Before it will show anything you must describe YOUR display in src/LGFX_User.h.
;
; In your own project, replace the symlink with:
;   lib_deps = jasonbolbach/GNSS@^0.1.0
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; If your board has PSRAM, add:  build_flags = -DBOARD_HAS_PSRAM   (the sprite is then allocated there)
lib_deps =
    symlink://../..
    lovyan03/LovyanGFX@^1.2.21
